name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run at a time, and a run in progress is never cancelled: a Pages deployment is keyed by the
# commit SHA, and one cancelled mid-deploy can never be retried for that SHA. A newer push waits
# for the run in progress, so deploys land in push order. A run still waiting when a newer one
# arrives is dropped before it starts, which leaves no deployment behind.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  # lint, typecheck, test, build with bundle-check, and the audit and secret scan.
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    # Skipped unless every ci job passed, so a push that fails a gate never ships.
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.4
      - run: make install
      - run: make build
      # The production bundle must never carry the IWER emulator.
      - run: make bundle-check
      # Maps are not referenced (sourcemap: 'hidden') and are checked above; they do not ship.
      - run: find dist -name '*.map' -delete
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
